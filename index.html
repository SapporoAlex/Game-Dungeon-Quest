<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#3b1607" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <title>Dungeon Quest</title>
    <link rel="icon" href="assets/images/icon.jpg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="game-wrap">
      <div id="canvas-stage">
        <canvas id="game-canvas" width="1200" height="800"></canvas>

        <div id="mission-select-overlay" class="screen-overlay" hidden>
          <div class="overlay-title">Choose Your Quest</div>
          <select id="mission-dropdown" class="overlay-select"></select>
          <div class="overlay-buttons">
            <button id="mission-back-btn" class="overlay-btn" type="button">
              Back
            </button>
            <button
              id="mission-start-btn"
              class="overlay-btn primary"
              type="button"
            >
              Start Quest
            </button>
          </div>
        </div>
      </div>

      <div id="mobile-controls">
        <div class="dpad" id="dpad">
          <button class="dpad-btn dpad-up" data-dir="up" aria-label="Move up">
            &#9650;
          </button>
          <button
            class="dpad-btn dpad-left"
            data-dir="left"
            aria-label="Move left"
          >
            &#9664;
          </button>
          <button
            class="dpad-btn dpad-down"
            data-dir="down"
            aria-label="Move down"
          >
            &#9660;
          </button>
          <button
            class="dpad-btn dpad-right"
            data-dir="right"
            aria-label="Move right"
          >
            &#9654;
          </button>
        </div>
        <div class="actions">
          <button class="action-btn" id="btn-move">Move</button>
          <button class="action-btn" id="btn-attack">Attack</button>
          <button class="action-btn" id="btn-search">Search</button>
          <button class="action-btn" id="btn-potion">Potion</button>
          <button class="action-btn pass" id="btn-pass">Pass Turn</button>
        </div>
      </div>
    </div>

    <div id="loading-overlay">
      <div class="loading-box">
        <div class="loading-title">Dungeon Quest</div>
        <div class="loading-bar">
          <div class="loading-bar-fill" id="loading-bar-fill"></div>
        </div>
        <div class="loading-label" id="loading-label">
          Loading assets&hellip;
        </div>
        <button id="sound-unlock-btn" class="loading-start-btn" hidden>
          Click to Start
        </button>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
